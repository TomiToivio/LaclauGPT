name: Meta-repo checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify meta-repo boundaries
        run: |
          test -d paper
          test -f THEORY.md
          test -f docs/architecture/MODULAR_ARCHITECTURE.md
          test -f docs/installation/FULL_SYSTEM.md
          test ! -f pyproject.toml
          test ! -d laclaugpt
          test ! -d collector
          test ! -d tests
      - name: Verify cross-module canonical parity fixture
        run: python scripts/verify_cross_module_fixture.py
      - name: Verify social-semiotic pre-analysis contract
        run: python scripts/verify_social_semiotic_contract.py
      - name: Verify optional messaging/task contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema_path = Path('schemas/messaging-task.schema.json')
          docs_path = Path('docs/MESSAGING_TASK_QUEUE.md')
          assert schema_path.is_file()
          assert docs_path.is_file()

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          props = schema['properties']
          assert props['messaging_backend']['enum'] == ['none', 'redis']
          assert props['messaging_backend']['default'] == 'none'
          assert props['task_queue_backend']['enum'] == ['direct', 'redis']
          assert props['task_queue_backend']['default'] == 'direct'
          assert props['redis']['properties']['url_env']['const'] == 'LACLAUGPT_REDIS_URL'

          defs = schema['$defs']
          task = defs['task_envelope']
          required_task_fields = {
              'schema_version', 'message_id', 'task_id', 'project_id', 'run_id',
              'task_type', 'idempotency_key', 'attempt', 'created_at', 'refs'
          }
          assert required_task_fields.issubset(set(task['required']))
          assert 'payload' not in task['properties']
          assert 'refs' in task['properties']

          heartbeat = defs['worker_heartbeat']
          assert {'worker_id', 'worker_role', 'status', 'updated_at'}.issubset(set(heartbeat['required']))
          assert 'dead_letter_event' in defs

          docs = docs_path.read_text(encoding='utf-8')
          for needle in (
              'messaging_backend = none',
              'task_queue_backend = direct',
              'messaging_backend = redis',
              'task_queue_backend = redis',
              'durable output before acknowledging',
              'LACLAUGPT_REDIS_URL',
          ):
              assert needle in docs, needle
          assert 'redis://' not in docs
          assert 'rediss://' not in docs
          print('Optional Redis messaging contract preserves direct mode and secret-free examples.')
          PY
      - name: Verify AI26 distributed public profiles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('deploy/ai26-distributed')
          expected = {
              'laptop.example.json': {
                  'role': 'laptop',
                  'execution': 'interactive',
                  'services': (True, False, False, True),
              },
              'roihu.example.json': {
                  'role': 'roihu',
                  'execution': 'slurm',
                  'services': (False, False, True, False),
              },
              'linux-server.example.json': {
                  'role': 'linux-server',
                  'execution': 'service',
                  'services': (False, True, True, True),
              },
          }
          forbidden_value_markers = ('mongodb://', 'mongodb+srv://', 'redis://', 'rediss://', 'AKIA')
          required_backend_envs = {
              'mongodb_uri_env': 'LACLAUGPT_MONGODB_URI',
              'redis_url_env': 'LACLAUGPT_REDIS_URL',
              's3_endpoint_env': 'LACLAUGPT_S3_ENDPOINT',
              's3_bucket_env': 'LACLAUGPT_S3_BUCKET',
              's3_access_key_env': 'LACLAUGPT_S3_ACCESS_KEY',
              's3_secret_key_env': 'LACLAUGPT_S3_SECRET_KEY',
          }

          schema = json.loads(Path('schemas/distributed-run.schema.json').read_text(encoding='utf-8'))
          assert schema['properties']['analysis']['properties']['model']['const'] == 'gemma4:12b'
          assert schema['properties']['analysis']['properties']['cloud_fallback']['const'] is False

          for name, want in expected.items():
              path = root / name
              raw = path.read_text(encoding='utf-8')
              data = json.loads(raw)
              assert not any(marker in raw for marker in forbidden_value_markers), path
              assert data['schema_version'] == '1.0', path
              assert data['project_id'] == 'ai26', path
              assert data['run_id_env'] == 'LACLAUGPT_RUN_ID', path
              assert data['machine_role'] == want['role'], path
              assert data['execution'] == want['execution'], path
              service_tuple = tuple(data['services'][key] for key in (
                  'firefox_collection', 'collectors', 'analysis_worker', 'dashboard'
              ))
              assert service_tuple == want['services'], path
              assert data['backends'] == required_backend_envs, path
              assert data['private_config'] == {
                  'config_dir_env': 'LACLAUGPT_PRIVATE_CONFIG_DIR',
                  'required': True,
                  'publish_contents': False,
              }, path
              assert data['analysis']['model'] == 'gemma4:12b', path
              assert data['analysis']['cloud_fallback'] is False, path
              assert 1 <= data['limits']['max_records_per_arena'] <= 10, path
              assert all(data['provenance'].values()), path

          slurm = (root / 'roihu.sbatch.example').read_text(encoding='utf-8')
          assert 'gemma4:12b' in slurm
          assert 'LACLAUGPT_PRIVATE_CONFIG_DIR' in slurm
          assert 'LACLAUGPT_MONGODB_URI' in slurm
          assert 'LACLAUGPT_REDIS_URL' in slurm
          assert 'LACLAUGPT_S3_ENDPOINT' in slurm
          print('AI26 distributed public profiles are secret-free and internally consistent.')
          PY
