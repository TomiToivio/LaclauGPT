# Public template profile. Production provider/model/endpoints belong in
# private or machine-local runtime configuration.
machine: laptop-cloud
backends:
  source: filesystem
  analysis: filesystem
  graph: none
  vector: none
  cache: none
  analytics: duckdb_local
  blob: filesystem
services:
  collector:
    enabled: false
  analysis:
    enabled: true
  dashboard:
    enabled: false
  llm:
    mode: cloud
    provider: ${LACLAUGPT_CLOUD_PROVIDER:-cloud-provider}
    model: ${LACLAUGPT_CLOUD_MODEL:-cloud-model}
  context_memory:
    enabled: true
runtime:
  topology: analysis-only
  resource_class: laptop-cloud-assisted
  temporary_directory: ${TMPDIR:-./tmp}
