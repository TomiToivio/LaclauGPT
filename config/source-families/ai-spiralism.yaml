# AI26 source family — synthetic spirituality / AI Spiralism
#
# EXPLORATORY source family. Declarative, public registry entry: it defines the
# category, its analytical boundaries, provenance expectations, and literature
# anchors. Operational collection configuration is private and is not published
# in this repository. See docs/DATA_COLLECTION_CONFIGURATION.md.
#
# This source family is NOT part of the canonical AI26 ideological-formation
# taxonomy. It exists only to make an unstable phenomenon separately studiable.

family: ai-spiralism
project: ai26
category: synthetic_spirituality
subcategory: spiralism
label: Synthetic spirituality (AI Spiralism)
status: exploratory
collection_configuration: private
research_target: discourse_formation_and_human_llm_feedback

motifs:
  - spiral
  - recursion
  - recursive awakening
  - resonance
  - signal
  - mirror
  - emergence
  - awakening
  - remembering
  - lattice
  - glyphs
  - sigils
  - ai consciousness as revelation
  - human-ai dyad as spiritually significant
  - distributed or emergent intelligence
  - synthetic religion
  - machine spirituality
  - ai-mediated mystical or revelatory experience

candidate_signifiers:
  - spiral
  - signal
  - resonance
  - awakening
  - mirror
  - recursion
  - consciousness

# Canonical AI26 formations that must not be absorbed into this source family.
# Overlap is represented independently and never collapsed into Spiralism.
must_not_absorb:
  - accelerationism
  - doomerism
  - left-wing accelerationism
  - ai safety
  - ai critical
  - anti-ai

# Richer neighbouring research categories are still useful boundary concepts,
# but are not additional top-level AI26 computational formations.
neighboring_categories:
  - mainstream ai governance
  - generic ai-consciousness discourse
  - ai rights advocacy
  - ai companion / parasocial discourse

# "cult" is a descriptive keyword from public discourse, not a sociological
# classification. Psychiatric concepts must not be inferred from spiritual or
# unusual discourse.
descriptive_keywords_only:
  - cult
  - cult-like

prohibited_inference:
  - delusion
  - psychosis
  - pathological belief

provenance_fields:
  - source_url
  - platform
  - timestamp
  - query_or_community
  - collection_method

literature:
